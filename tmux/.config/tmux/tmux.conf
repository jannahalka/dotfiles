
# ─── Terminal ─────────────────────────────────────────
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm*:RGB"
set -g mouse on

# ─── Prefix ───────────────────────────────────────────
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# Reload configuration
bind r source-file ~/.config/tmux/tmux.conf \; display-message "Config reloaded"

# ─── General ──────────────────────────────────────────
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g escape-time 0
set -g focus-events on
set -g history-limit 50000

# ─── Plugins ──────────────────────────────────────────
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'

# ─── Copy Mode ────────────────────────────────────────
setw -g mode-keys vi
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel 'wl-copy'

# ─── Navigation ───────────────────────────────────────
bind -r ^ last-window
bind -r k select-pane -U
bind -r j select-pane -D
bind -r h select-pane -L
bind -r l select-pane -R

# ─── Catppuccin Mocha Palette ─────────────────────────
set -g @bg       '#1e1e2e'
set -g @surface  '#313244'
set -g @overlay  '#45475a'
set -g @muted    '#6c7086'
set -g @fg       '#cdd6f4'
set -g @blue     '#89b4fa'
set -g @sky      '#89dceb'
set -g @peach    '#fab387'

# ─── Status Bar ───────────────────────────────────────
set -g status on
set -g status-position bottom
set -g status-interval 5
set -g status-justify left
set -g status-style "bg=#{@bg},fg=#{@fg}"

set -g status-left-length 20
set -g status-right-length 40

# Session: blue text, no background block
set -g status-left \
    "#[bg=#{@bg},fg=#{@blue},bold,nounderscore] #S  "

# Inactive windows: muted text
setw -g window-status-style \
    "bg=#{@bg},fg=#{@muted},nobold,nounderscore"

setw -g window-status-format \
    " #I:#W  "

# Active window: blue text, no block or underline
setw -g window-status-current-style \
    "bg=#{@bg},fg=#{@blue},bold,nounderscore"

setw -g window-status-current-format \
    " #I:#W  "

set -g window-status-separator ""

# Prevent activity/bell indicators from changing colors
setw -g window-status-activity-style \
    "bg=#{@bg},fg=#{@muted},nounderscore"

setw -g window-status-bell-style \
    "bg=#{@bg},fg=#{@muted},nounderscore"

# Date and time
set -g status-right \
    "#[fg=#{@muted}]%Y-%m-%d  #[fg=#{@sky},bold]%H:%M "

# ─── Pane Borders ─────────────────────────────────────
set -g pane-border-style "fg=#{@surface}"
set -g pane-active-border-style "fg=#{@blue}"

# ─── Pane Indicators ──────────────────────────────────
set -g display-panes-colour "#{@overlay}"
set -g display-panes-active-colour "#{@blue}"

# ─── Messages ─────────────────────────────────────────
set -g message-style "bg=#{@surface},fg=#{@fg}"
set -g message-command-style "bg=#{@surface},fg=#{@blue}"

# ─── Copy Mode Highlight ──────────────────────────────
setw -g mode-style "bg=#{@blue},fg=#{@bg}"

# ─── Clock ────────────────────────────────────────────
set -g clock-mode-colour "#{@peach}"

# ─── TPM ──────────────────────────────────────────────
set-environment -g TMUX_PLUGIN_MANAGER_PATH "$HOME/.config/tmux/plugins/"
run '~/.config/tmux/plugins/tpm/tpm'
